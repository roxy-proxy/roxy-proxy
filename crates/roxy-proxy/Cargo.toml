[package]
name = "roxy-proxy"
description = "Listeners, flow pipeline, upstream connector and flow log for roxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
roxy-wasm.workspace = true
arc-swap = "1.9.2"
bytes = "1.12.1"
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
hickory-resolver = { version = "0.26.3", features = ["tokio", "system-config"] }
h2 = "0.4.19"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio", "http1", "http2"] }
ring.workspace = true
ipnet.workspace = true
roxy-http.workspace = true
roxy-log.workspace = true
roxy-rules.workspace = true
roxy-tls.workspace = true
rustls = { version = "0.23.45", default-features = false, features = ["ring", "tls12", "std", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-service = "0.3.3"
tracing.workspace = true
ulid = "3.0.0"

[dev-dependencies]
serde_yaml_ng.workspace = true
criterion = { version = "0.8.2", default-features = false }
proptest = "1.11.0"
tempfile.workspace = true
flate2 = "1.1.5"

[lints]
workspace = true

[[bench]]
name = "addrlist"
harness = false
