[package]
name = "roxy-addon"
description = "SDK for writing roxy addon layers as WebAssembly components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["roxy", "proxy", "wasm", "component", "addon"]
categories = ["wasm", "network-programming"]
# The WIT package is copied into the crate (wit/) so it can be published on
# its own; a test checks it matches the workspace's /wit.
include = ["src/**", "wit/**", "README.md"]

[dependencies]
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc", "std"] }

# Same lints as the workspace, except that `unsafe_code` is `deny` rather than
# `forbid`: the code wit-bindgen generates contains `unsafe` blocks, so the
# generated `bindings` module allows it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
