[package]
name = "roxy-wasm"
description = "WASM layer host for roxy addons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
roxy-http.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util"] }
tracing.workspace = true
wasmtime = { version = "49.0.2", default-features = false, features = [
    "async",
    "call-hook",
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util", "test-util"] }

# The workspace lints, except that `unsafe_code` is `deny` rather than
# `forbid`: the code `wasmtime::component::bindgen!` generates contains
# `unsafe` blocks, so `src/bindings.rs` (generated code only) allows it.
# Everything hand-written in this crate is still free of `unsafe`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
