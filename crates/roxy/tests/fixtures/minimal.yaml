# A minimal configuration, for the config and CLI tests: one HTTP-proxy
# listener and one allow rule.
# Everything else uses the defaults. Any request
# not matched by a rule is denied.
version: 1

listeners:
  - name: proxy
    bind: 127.0.0.1:3128

rules:
  - id: example
    when: host == "example.com" and method in [GET, HEAD]
    then: allow
