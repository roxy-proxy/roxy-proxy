[package]
name = "roxy"
description = "A TLS-inspecting HTTP firewall for containing AI agent traffic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "roxy"
path = "src/main.rs"

[dependencies]
http = "1.5.0"
serde_json.workspace = true
roxy-wasm.workspace = true
anyhow.workspace = true
chrono.workspace = true
bytesize.workspace = true
clap.workspace = true
humantime-serde.workspace = true
ipnet.workspace = true
roxy-proxy.workspace = true
roxy-rules.workspace = true
roxy-tls.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
roxy-http.workspace = true
notify = "8.2.0"
arc-swap = "1"

[dev-dependencies]
bcrypt = "0.19.3"
bytes = "1.12.1"
futures-util = "0.3.34"
h2 = "0.4.19"
http = "1.5.0"
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "tokio", "http1", "http2"] }
rcgen.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "tls12", "std"] }
serde_json.workspace = true
tempfile.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true
