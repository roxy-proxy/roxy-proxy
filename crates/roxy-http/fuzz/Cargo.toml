[package]
name = "roxy-http-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.12.1"
libfuzzer-sys = "0.4"
roxy-http = { path = ".." }

# Not a member of the main workspace (needs nightly); this is its own root.
[workspace]
members = ["."]

[[bin]]
name = "h1_head"
path = "fuzz_targets/h1_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h1_chunked"
path = "fuzz_targets/h1_chunked.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url_normalize"
path = "fuzz_targets/url_normalize.rs"
test = false
doc = false
bench = false
