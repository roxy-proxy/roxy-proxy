[package]
name = "roxy-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
httparse = "1.10.1"
httpdate = "1.0.3"
sha1 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
proptest = "1.11.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "test-util"] }
