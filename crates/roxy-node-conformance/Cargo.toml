[package]
name = "roxy-node-conformance"
description = "Conformance harness and in-memory reference server for the roxy node protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "roxy-node-conformance"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
bytes = "1.12.1"
clap = { workspace = true, features = ["env"] }
flate2 = "1.1.10"
http = "1.5.0"
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
pem.workspace = true
rcgen.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
ring.workspace = true
rustls = { version = "0.23.45", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false }
x509-parser.workspace = true

[lints]
workspace = true
