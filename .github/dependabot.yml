# Weekly version updates. pip, npm and Actions: minor and patch bumps arrive as
# one grouped PR per ecosystem and majors get their own; cargo: see below.
#
# Every ecosystem waits before taking a new release: a hijacked or malicious
# publish is usually caught and yanked within days, and the wait keeps it out
# of a bump PR in the meantime. Security updates ignore the cooldown, so a
# release that fixes a published advisory still arrives at once; a fix with no
# advisory waits like any other release, or is bumped by hand.
version: 2
updates:
  - package-ecosystem: cargo
    # Every Cargo workspace with its own lock file; the nested ones depend on
    # the root crates by path and CI runs them with --locked.
    directories:
      - /
      - /crates/roxy-wasm/test-components
      - /examples/quickstart/addons
      - /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    # One PR for every cargo bump across all four workspaces, majors
    # included: the nested lock files pin the root crates' dependencies
    # through path dependencies, so a bump that lands in only one lock
    # fails CI's --locked runs.
    groups:
      cargo:
        patterns: ["*"]
  # The quickstart's Python services, each with its own requirements files.
  - package-ecosystem: pip
    directories:
      - /examples/quickstart/controlplane
      - /examples/quickstart/mocks
      - /examples/quickstart/sentinel
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
