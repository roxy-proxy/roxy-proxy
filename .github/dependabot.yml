# Weekly version updates. Minor and patch bumps arrive as one grouped PR per
# ecosystem; major bumps get their own PR.
version: 2
updates:
  - package-ecosystem: cargo
    # Every Cargo workspace with its own lock file; the nested ones depend on
    # the root crates by path and CI runs them with --locked.
    directories:
      - /
      - /crates/roxy-wasm/test-components
      - /examples/quickstart/addons
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
