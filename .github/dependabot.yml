# Weekly version updates. npm and Actions: minor and patch bumps arrive as one
# grouped PR per ecosystem and majors get their own; cargo: see below.
version: 2
updates:
  - package-ecosystem: cargo
    # Every Cargo workspace with its own lock file; the nested ones depend on
    # the root crates by path and CI runs them with --locked.
    directories:
      - /
      - /crates/roxy-wasm/test-components
      - /examples/quickstart/addons
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for every cargo bump across all four workspaces, majors
    # included: the nested lock files pin the root crates' dependencies
    # through path dependencies, so a bump that lands in only one lock
    # fails CI's --locked runs.
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
