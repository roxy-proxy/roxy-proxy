name: CI

# Pull requests run on their own event; branch pushes would only repeat
# them, so pushes run on main alone. merge_group runs the required checks
# on the merge queue's candidate commit.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # Every workspace with its own lock file, against the root deny.toml. One
  # job, not a matrix: the branch rules require a check named `deny`.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Cargo.toml
          arguments: --locked --config deny.toml
          command: check advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: crates/roxy-wasm/test-components/Cargo.toml
          arguments: --locked --config deny.toml
          command: check advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: examples/quickstart/addons/Cargo.toml
          arguments: --locked --config deny.toml
          command: check advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          arguments: --locked --config deny.toml
          command: check advisories bans licenses sources

  # roxy-wasm's test components live in their own workspace and are checked
  # in prebuilt, so the jobs above need no wasm target. This job rebuilds
  # them from source and fails if the result differs from the checked-in
  # binaries, so a source change without build.sh cannot land.
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/roxy-wasm/test-components -> target
      - name: Format the test components, lint and unit-test the SDK-built one
        working-directory: crates/roxy-wasm/test-components
        run: |
          cargo fmt --all --check
          cargo clippy -p redact --all-targets -- -D warnings
          cargo test -p redact
      - name: Rebuild the components
        run: crates/roxy-wasm/test-components/build.sh
      - name: Check the rebuilt components match the checked-in fixtures
        run: git diff --exit-code --stat crates/roxy-wasm/tests/fixtures
      - name: Run the host tests against the fresh builds
        run: cargo test -p roxy-wasm
