name: CI

# Pull requests run on their own event; branch pushes would only repeat
# them, so pushes run on main alone. merge_group runs the required checks
# on the merge queue's candidate commit.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # Every workspace with its own lock file, against the root deny.toml.
  deny:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - crates/roxy-wasm/test-components/Cargo.toml
          - examples/quickstart/addons/Cargo.toml
          - fuzz/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --locked --config deny.toml
          command: check advisories bans licenses sources

  # roxy-wasm's test components live in their own workspace and are checked
  # in prebuilt, so the jobs above need no wasm target. This job rebuilds
  # them from source and runs the tests that load them against the fresh
  # builds, so the checked-in binaries cannot silently drift from their
  # sources.
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/roxy-wasm/test-components -> target
      - name: Format the test components, lint and unit-test the SDK-built one
        working-directory: crates/roxy-wasm/test-components
        run: |
          cargo fmt --all --check
          cargo clippy -p redact --all-targets -- -D warnings
          cargo test -p redact
      - name: Rebuild the components
        run: crates/roxy-wasm/test-components/build.sh
      - name: Run the host tests against the fresh builds
        run: cargo test -p roxy-wasm
