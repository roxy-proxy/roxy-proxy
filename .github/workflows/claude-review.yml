name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Drafts are skipped; marking a PR ready fires ready_for_review, and
    # later pushes to a ready PR still get reviewed via synchronize.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}

          use_sticky_comment: true

          # Your custom review instructions
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This PR may have been reviewed before. First read your earlier
            review and comments with `gh pr view --comments` and
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            Do not repeat a finding you already raised. If an earlier finding
            is now fixed, say so in your summary; if it still stands, say so
            once rather than posting a new inline comment.

            Review the PR against the "Reviewing a pull request" section of
            CLAUDE.md, which sets this repo's priorities. Approve only after
            you have looked for a counter-example yourself and found none;
            agreeing with the PR description is not that. If Copilot or
            another reviewer has posted findings, evaluate each one and say
            whether you agree.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise. 
            
            If there are no blocking issues, and you are confident in your assessment of
            the PR, run exactly:
            gh pr review ${{ github.event.pull_request.number }} --approve --body "<short summary>"

            If a PR is too large or complex for you to have high confidence in your opinion,
            then you should offer whatever insight you can via comments, without approving.
            In that case, and whenever you find a blocking issue, end by running:
            gh pr review ${{ github.event.pull_request.number }} --comment --body "<summary of findings and why you are not approving>"
            Every run ends with exactly one of those two commands; a review that posts
            nothing is a failure.

          # Tools for comprehensive PR review
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh pr review ${{ github.event.pull_request.number }} --approve:*),Bash(gh pr review ${{ github.event.pull_request.number }} --comment:*)"
