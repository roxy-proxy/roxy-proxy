name: PR Review


on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Drafts are skipped; marking a PR ready fires ready_for_review, and
    # later pushes to a ready PR still get reviewed via synchronize.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}

          use_sticky_comment: true

          # Your custom review instructions
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This PR may have been reviewed before. First read your earlier
            review and comments with `gh pr view --comments` and
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            Do not repeat a finding you already raised. If an earlier finding
            is now fixed, say so in your summary; if it still stands, say so
            once rather than posting a new inline comment.

            Review the PR against the "Reviewing a pull request" section of
            CLAUDE.md, which sets this repo's priorities.

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise. If there
            are no blocking issues, run exactly:
            gh pr review ${{ github.event.pull_request.number }} --approve --body "<short summary>"


          # Tools for comprehensive PR review
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh pr review ${{ github.event.pull_request.number }} --approve:*)"
