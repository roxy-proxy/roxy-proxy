name: Quickstart

# The quickstart's sentinel sidecar is Python, outside the Rust workspace
# that ci.yml tests, so its tests (including the fail-closed cases) run
# here when the example changes.
on:
  push:
    branches: [main]
    paths:
      - examples/quickstart/**
      - .github/workflows/quickstart.yml
  pull_request:
    paths:
      - examples/quickstart/**
      - .github/workflows/quickstart.yml

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/quickstart/sentinel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/quickstart/sentinel/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest
