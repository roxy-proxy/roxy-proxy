name: Quickstart

# Runs the README's docker compose quickstart end to end: builds the image
# from this checkout, starts roxy and the sandboxed agent, and runs
# examples/compose/demo.sh, which checks that allowed traffic gets through,
# denied traffic is refused, and the agent has no route around roxy.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "examples/compose/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/quickstart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start
        env:
          ROXY_IMAGE: roxy:quickstart
        run: docker compose up -d --wait --build

      - name: Demo
        env:
          ROXY_IMAGE: roxy:quickstart
        run: ./demo.sh

      - name: Logs
        if: always()
        env:
          ROXY_IMAGE: roxy:quickstart
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        env:
          ROXY_IMAGE: roxy:quickstart
        run: docker compose down -v
