name: Quickstart

# The quickstart is outside the Rust workspace that ci.yml tests: its
# addons are their own workspace, and the sentinel sidecar and mocks are
# Python. Their checks run here when the example changes, and the stack is
# run end to end.
on:
  push:
    branches: [main]
    paths:
      - examples/quickstart/**
      - crates/roxy-addon/**
      - .dockerignore
      - .github/workflows/quickstart.yml
  pull_request:
    paths:
      - examples/quickstart/**
      - crates/roxy-addon/**
      - .dockerignore
      - .github/workflows/quickstart.yml

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/quickstart/sentinel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/quickstart/sentinel/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest

  addons:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/quickstart/addons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/quickstart/addons
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings -W clippy::pedantic
      - run: cargo test --locked
      - run: cargo build --release --locked --target wasm32-wasip2

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The stack runs the roxy in this tree, not the published image, so a
      # change roxy and the quickstart make together is tested as one.
      - name: Build roxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: roxy:local
          cache-from: type=gha,scope=image-amd64
      - run: examples/quickstart/smoke.sh
        env:
          ROXY_IMAGE: roxy:local
          # The daemon's own builder, which sees the loaded roxy:local.
          BUILDX_BUILDER: default
      - if: failure()
        run: docker compose logs
        working-directory: examples/quickstart
