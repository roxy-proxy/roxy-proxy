openapi: 3.1.0
info:
  title: roxy node protocol
  version: "1"
  summary: The contract between a roxy node and its control plane.
  description: |
    Enrolment authenticates with a bearer token; every other operation
    authenticates with the node certificate (mutual TLS). The
    listener must accept connections without a client certificate so that
    enrolment can happen, and answer every other operation that arrives
    without one with `401`. Unknown fields in any body are ignored by both
    sides. The prose explanation is `docs/pages/reference/node-protocol.md`.
  license:
    name: MIT OR Apache-2.0
servers:
  - url: https://{control_plane}/roxy/v1
    variables:
      control_plane:
        default: control-plane.example
        description: Host and port from the node's bootstrap material.

security:
  - nodeCertificate: []

paths:
  /enrol:
    post:
      operationId: enrol
      summary: Exchange an enrolment token for a node certificate.
      description: |
        The CSR's signature proves the node holds the key. The server takes
        the public key, ignores the CSR's subject and extensions, and issues a
        certificate whose only SAN is the URI `urn:roxy:node:<node_id>`. The
        token authorises enrolment; its lifetime and reuse policy (single-use,
        time-limited, shared across an autoscaling group) are the server's to
        set, and single-use with a short expiry is the recommended default.
        The node infers nothing from a `200` beyond the certificate it was
        issued.
      security:
        - enrolmentToken: []
      requestBody:
        $ref: "#/components/requestBodies/EnrolRequest"
      responses:
        "200":
          $ref: "#/components/responses/Enrolled"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            The token was not accepted. The node retries with backoff for a
            bounded window (a new token may not have reached every replica),
            then exits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_token
                message: enrolment token not recognised
        "426":
          $ref: "#/components/responses/Unsupported"
        "5XX":
          $ref: "#/components/responses/ServerError"

  /renew:
    post:
      operationId: renew
      summary: Replace the node certificate before it expires.
      description: |
        Same body and response as enrolment; `node_id` is unchanged. The old
        certificate stays valid until its own `not_after`. A `5xx` or
        transport failure is retried with backoff; `410` is terminal; any
        other `4xx` ends renewal. If the certificate expires first the node
        can no longer fetch leases and its lease runs down.
      requestBody:
        $ref: "#/components/requestBodies/EnrolRequest"
      responses:
        "200":
          $ref: "#/components/responses/Enrolled"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unrecognised"
        "410":
          $ref: "#/components/responses/Revoked"
        "426":
          $ref: "#/components/responses/Unsupported"
        "5XX":
          $ref: "#/components/responses/ServerError"

  /lease:
    post:
      operationId: lease
      summary: Report the node's state and fetch its lease.
      description: |
        The body is the node's state. Every poll answers `200` with the full
        lease; the node compares `config` and `secrets` with what it holds
        and applies only what differs. A lease whose `lease_id` matches the
        one reported only moves `valid_until`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeState"
      responses:
        "200":
          description: The node's lease. The node applies it in full or not at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unrecognised"
        "410":
          $ref: "#/components/responses/Revoked"
        "426":
          $ref: "#/components/responses/Unsupported"
        "5XX":
          $ref: "#/components/responses/ServerError"

  /flows:
    post:
      operationId: flows
      summary: Upload a batch of flow-log events, at least once.
      description: |
        Events carry a per-node `seq` that increases by one per shipped
        event and is persisted across restarts. The server deduplicates on
        `(node_id, seq)` and acknowledges the highest `seq` it has stored; the
        node drops spooled events at or below it. A restart leaves a gap (the
        counter is reserved in blocks), as do events while `ship` is false
        and events dropped under `on_high_water: spool`; a gap within one run
        is the anomaly, a server-side alert, not an error. The node keeps
        every batch within the lease's `batch_max_bytes`; a server that
        refuses a batch within that size is a server error, treated as `5XX`.
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          description: "`gzip` when the body is compressed."
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowBatch"
      responses:
        "200":
          description: The batch is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowAck"
        "400":
          description: |
            Malformed, `node_id` does not match the certificate (`node_mismatch`),
            `lease_id` was never issued to this node, or events are not
            consecutive from `seq_first`. The node logs it apart from an
            unavailable server and retries the batch like any other failure:
            a rejected batch is unshipped audit and stays spooled, so under
            `on_high_water: hold` traffic stalls until the server accepts it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unrecognised"
        "410":
          $ref: "#/components/responses/Revoked"
        "507":
          description: |
            The node's flow quota is exhausted. Terminal for shipping until a
            lease with a new `lease_id` arrives: the node stops shipping, logs
            once and applies `on_high_water` to what accumulates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    enrolmentToken:
      type: http
      scheme: bearer
      description: The enrolment token from the node's bootstrap material.
    nodeCertificate:
      type: mutualTLS
      description: |
        The node certificate issued at enrolment, whose URI SAN
        `urn:roxy:node:<node_id>` names the node. The node presents the whole
        chain from the enrolment response.

  requestBodies:
    EnrolRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnrolRequest"

  responses:
    Enrolled:
      description: A certificate for the node.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnrolResponse"
    BadRequest:
      description: The request was malformed. The node logs it and does not retry the same request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unrecognised:
      description: |
        No client certificate, or one that does not map to a known node. The
        node logs once per outcome change and lets its lease run down. It
        never re-enrols on its own: re-enrolment is an operator action (a new
        token and an empty state dir). A TLS handshake the server rejects
        because of the client certificate is treated the same way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Revoked:
      description: |
        The node is revoked. Definite and terminal: the node writes an empty
        policy at once, ships what is spooled, stops polling and keeps health
        up.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unsupported:
      description: |
        The server will not serve this protocol version, or this
        `roxy_version` is below the floor it serves. `missing` names what the
        node lacks. For the lease the node treats this as a server error (the
        lease runs down) but logs it distinctly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unsupported
            message: "roxy 0.1.0 is below this server's floor of 0.2.0"
            missing: ["roxy_version:0.2.0"]
    ServerError:
      description: |
        The control plane is unavailable. Together with timeouts and
        connection errors: retry with backoff; the lease runs down.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    NodeId:
      type: string
      pattern: "^[A-Za-z0-9._-]{1,128}$"
      description: Chosen by the server at enrolment; stable for the life of the node.

    Seq:
      type: integer
      minimum: 0
      maximum: 18446744073709551615

    EnrolRequest:
      type: object
      description: Body of enrol and renew.
      required: [csr, roxy_version, protocol_version]
      properties:
        csr:
          type: string
          description: PEM `CERTIFICATE REQUEST` for an ECDSA P-256 or Ed25519 key, signed by that key.
          pattern: "^-----BEGIN CERTIFICATE REQUEST-----[\\s\\S]+-----END CERTIFICATE REQUEST-----\\s*$"
        roxy_version:
          type: string
          minLength: 1
        protocol_version:
          type: integer
          const: 1

    EnrolResponse:
      type: object
      description: "`200` body of enrol and renew."
      required: [node_id, certificate_chain, not_after, renew_after_seconds]
      properties:
        node_id:
          $ref: "#/components/schemas/NodeId"
        certificate_chain:
          type: string
          description: |
            PEM: the node certificate first, then intermediates up to but not
            including the root. The node certificate's only SAN is the URI
            `urn:roxy:node:<node_id>`.
          pattern: "^-----BEGIN CERTIFICATE-----[\\s\\S]+-----END CERTIFICATE-----\\s*$"
        not_after:
          type: string
          format: date-time
          description: The certificate's expiry, RFC 3339 in UTC, as in the certificate.
        renew_after_seconds:
          type: integer
          minimum: 1
          description: Seconds after receipt at which the node renews. Well inside the certificate lifetime.

    NodeState:
      type: object
      description: Body of the lease fetch.
      required:
        - lease_id
        - roxy_version
        - protocol_version
        - uptime_seconds
        - policy_state
        - spooled_bytes
      properties:
        lease_id:
          type: [string, "null"]
          minLength: 1
          description: The lease the node holds; null before the first lease.
        roxy_version:
          type: string
          minLength: 1
        protocol_version:
          type: integer
          const: 1
        uptime_seconds:
          type: integer
          minimum: 0
        policy_state:
          type: string
          enum: [none, loaded, expired]
          description: "`none` before the first lease; `expired` after it ran down or the node was revoked."
        spooled_bytes:
          type: integer
          minimum: 0
          description: Flow-log bytes accepted but not yet acknowledged.

    SecretValue:
      type: string
      description: UTF-8 text.

    FlowSettings:
      type: object
      required:
        - ship
        - batch_max_bytes
        - flush_interval_seconds
        - spool_high_water_bytes
        - on_high_water
      properties:
        ship:
          type: boolean
          description: "`false` turns shipping off; the other fields are still required."
        batch_max_bytes:
          type: integer
          minimum: 1
          description: Largest batch, measured on the JSON before compression.
        flush_interval_seconds:
          type: integer
          minimum: 1
          description: Flush when this long has passed since the first unsent event.
        spool_high_water_bytes:
          type: integer
          minimum: 0
        on_high_water:
          type: string
          enum: [hold, spool]
          description: "`hold` stalls traffic with roxy's backpressure; `spool` drops the oldest spooled events, logging once."

    Lease:
      type: object
      description: "`200` body of the lease fetch."
      required:
        - lease_id
        - valid_for_seconds
        - refresh_after_seconds
        - config
        - secrets
        - state_epoch
        - flow
      properties:
        lease_id:
          type: string
          minLength: 1
          description: Opaque; changes whenever any other field changes. The node reports it on every poll.
        valid_for_seconds:
          type: integer
          minimum: 1
          description: |
            A duration. The node sets `valid_until = sent_at + valid_for_seconds`,
            where `sent_at` is its own clock just before it sent the request,
            so clock skew between node and server cannot shorten or lengthen
            the lease, and a slow answer shortens it rather than extending it.
        refresh_after_seconds:
          type: integer
          minimum: 1
          description: When to poll next, counted the same way; well inside `valid_for_seconds`. The node polls no later than halfway through the lease whatever the value.
        config:
          type: string
          description: |
            A complete `roxy.yaml` with no secret values: every `secrets:`
            entry whose value the lease carries is `name: { lease: true }`.
            A change from what the node holds rebuilds the policy.
        secrets:
          type: object
          description: |
            Each secret name the config declares, to its value. A change with
            `config` unchanged swaps the secret map only.
          additionalProperties:
            $ref: "#/components/schemas/SecretValue"
        state_epoch:
          type: string
          minLength: 1
          description: |
            Opaque. When it differs from the previous lease's, the node clears
            every rule `set_state` entry and metric window before applying the
            lease. The first lease sets it without clearing anything.
        flow:
          $ref: "#/components/schemas/FlowSettings"
        interception_ca:
          description: Reserved for a later version. A v1 server must not send it; a v1 node ignores it.
          not: {}

    FlowEvent:
      type: object
      description: A flow-log record with `seq` added.
      required: [seq, ts, event]
      properties:
        seq:
          $ref: "#/components/schemas/Seq"
        ts:
          type: string
          format: date-time
        event:
          type: string
          minLength: 1

    FlowBatch:
      type: object
      description: Body of the flow upload, optionally gzip-compressed.
      required: [node_id, lease_id, seq_first, events]
      properties:
        node_id:
          $ref: "#/components/schemas/NodeId"
        lease_id:
          type: string
          minLength: 1
          description: The lease in force when the batch was assembled; any lease id issued to the node is accepted.
        seq_first:
          $ref: "#/components/schemas/Seq"
        events:
          type: array
          minItems: 1
          description: Consecutive, in order, starting at `seq_first`.
          items:
            $ref: "#/components/schemas/FlowEvent"

    FlowAck:
      type: object
      description: "`200` body of the flow upload."
      required: [acked_through]
      properties:
        acked_through:
          $ref: "#/components/schemas/Seq"
          description: The highest `seq` the server has stored for this node.

    Error:
      type: object
      description: Body of every non-`2xx` response. The node acts on the status code, not the body.
      required: [error, message]
      properties:
        error:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: A stable code.
        message:
          type: string
        missing:
          type: array
          description: "On `426`: what the node lacks, for example `protocol_version:1` or `roxy_version:0.2.0`."
          minItems: 1
          items:
            type: string
            minLength: 1
      if:
        properties:
          error:
            const: unsupported
      then:
        required: [missing]
