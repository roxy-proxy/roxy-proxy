<svg xmlns="http://www.w3.org/2000/svg" width="800" height="356" viewBox="0 0 800 356" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
  </defs>

  <!-- roxy -->
  <rect x="112" y="72" width="576" height="206" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="128" y="96" fill="#0f766e" font-weight="600">roxy</text>

  <!-- stages -->
  <g stroke="#cfd4d2" fill="#f3f5f4">
    <rect x="128" y="104" width="84" height="156" rx="6"/>
    <rect x="224" y="104" width="100" height="156" rx="6" stroke-dasharray="4 3"/>
    <rect x="336" y="104" width="96" height="156" rx="6" stroke-dasharray="4 3"/>
    <rect x="444" y="104" width="96" height="156" rx="6"/>
    <rect x="552" y="104" width="120" height="156" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="170" y="130">TLS</text>
    <text x="384" y="130">Addon</text>
    <text x="492" y="130">Rules</text>
    <text x="612" y="130">Connect</text>
  </g>
  <g fill="#5f6b68" font-size="14" text-anchor="middle">
    <text x="170" y="248">decrypt</text>
    <text x="274" y="248">service</text>
    <text x="384" y="248">WASM</text>
    <text x="492" y="248">deny wins</text>
    <text x="612" y="248">address floor</text>
  </g>

  <!-- client and upstream -->
  <rect x="4" y="154" width="96" height="44" rx="22" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="52" y="182" fill="#16201e" font-weight="600" text-anchor="middle">client</text>
  <rect x="700" y="154" width="96" height="44" rx="22" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="748" y="182" fill="#16201e" font-weight="600" text-anchor="middle">upstream</text>

  <!-- service sidecar -->
  <rect x="204" y="4" width="140" height="52" rx="6" fill="#ffffff" stroke="#cfd4d2"/>
  <text x="274" y="26" fill="#16201e" font-weight="600" text-anchor="middle">Service</text>
  <text x="274" y="46" fill="#5f6b68" font-size="13" text-anchor="middle">over WebSocket</text>

  <!-- request and response, each leaving roxy for the service addon and coming back -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <path d="M 100 150 H 252 V 58" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 266 58 V 150 H 698" stroke="#0f766e" marker-end="url(#req)"/>
    <g stroke="#f3f5f4" stroke-width="6">
      <line x1="282" y1="142" x2="282" y2="158"/>
      <line x1="296" y1="142" x2="296" y2="158"/>
    </g>
    <path d="M 700 204 H 296 V 58" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 282 58 V 204 H 102" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <text x="274" y="130" fill="#16201e" font-weight="600" text-anchor="middle" stroke="#f3f5f4" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Addon</text>
  <text x="104" y="141" fill="#0f766e" font-size="14" font-weight="600">request</text>
  <text x="696" y="224" fill="#5f6b68" font-size="14" font-weight="600" text-anchor="end">response</text>

  <!-- capture: records what the rules allow, before the address floor -->
  <path d="M 546 66 V 278" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="546" y="58" fill="#0f766e" font-size="14" font-weight="600" text-anchor="middle">capture</text>

  <!-- flow log -->
  <g stroke="#cfd4d2" stroke-dasharray="3 3">
    <line x1="170" y1="260" x2="170" y2="306"/>
    <line x1="274" y1="260" x2="274" y2="306"/>
    <line x1="384" y1="260" x2="384" y2="306"/>
    <line x1="492" y1="260" x2="492" y2="306"/>
    <line x1="612" y1="260" x2="612" y2="306"/>
  </g>
  <rect x="112" y="306" width="576" height="42" rx="21" fill="#f8f9f8" stroke="#e6e8e7"/>
  <text x="400" y="333" fill="#3d4846" font-size="16" text-anchor="middle">flow log: every exchange and every decision, never dropped</text>
</svg>
