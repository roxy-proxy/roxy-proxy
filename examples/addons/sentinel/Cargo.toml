[package]
name = "sentinel"
description = "Example roxy addon: an inspect-sentinel that blocks LLM tool calls by policy"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roxy-addon = { path = "../../../crates/roxy-addon" }
# regex-lite: small, no Unicode tables; enough for tool-name and argument
# patterns, and keeps the component small.
regex-lite = "0.1"
serde_json = "1"
