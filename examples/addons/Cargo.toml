# Example roxy addons. A separate workspace (not a member of the root one):
# addons build for wasm32-wasip2. See each example's README.
[workspace]
resolver = "3"
members = ["redact"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
