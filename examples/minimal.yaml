# Minimal roxy configuration: one explicit-proxy listener and one allow rule.
# Everything else uses the defaults from DESIGN.md §5.3 / §6.1. Any request
# not matched by a rule is denied.
version: 1

listeners:
  - name: proxy
    bind: 127.0.0.1:3128

rules:
  - id: example
    when: host == "example.com" and method in [GET, HEAD]
    then: allow
