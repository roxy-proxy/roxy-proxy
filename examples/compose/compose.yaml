# roxy quickstart: an "agent" container whose only way out is through roxy.
#
# Containment comes from the network, not from the proxy variables:
#
#   - `agent` is only on `sandbox`, an `internal: true` network. Docker gives
#     an internal network no route out, so the agent cannot reach anything
#     outside it, whatever it does with HTTP_PROXY.
#   - `roxy` is the only container on both `sandbox` and `egress` (an
#     ordinary bridge network with a route out). It is the agent's only path
#     to the internet, and it decides what goes through.
#   - HTTP_PROXY / HTTPS_PROXY only tell well-behaved clients where that path
#     is. A client that ignores them simply has no route.
#
#   docker compose up -d --wait        # uses ghcr.io/roxy-proxy/roxy:edge
#   ./demo.sh                          # shows what is allowed, denied and impossible
#   docker compose logs roxy           # the flow log (JSON lines)
#   docker compose down -v
#
# To build roxy from this checkout instead: docker compose up -d --wait --build
name: roxy-quickstart

services:
  roxy:
    image: ${ROXY_IMAGE:-ghcr.io/roxy-proxy/roxy:edge}
    build:
      context: ../..
    # The image's hardening, kept here: read-only root, no capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./roxy.yaml:/etc/roxy/roxy.yaml:ro
      - roxy-ca:/var/lib/roxy/ca     # keep the CA across restarts
    networks: [sandbox, egress]
    # The image's HEALTHCHECK (`roxy health`) gates the agent's start.

  agent:
    image: curlimages/curl:8.17.0
    depends_on:
      roxy:
        condition: service_healthy
    networks: [sandbox]              # no route out except through roxy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      # curl reads the lower-case http_proxy only; set both cases for other
      # tools.
      http_proxy: http://roxy:3128
      https_proxy: http://roxy:3128
      HTTP_PROXY: http://roxy:3128
      HTTPS_PROXY: http://roxy:3128
      # roxy itself (its CA endpoint) is reached directly, never via the proxy.
      no_proxy: roxy
      NO_PROXY: roxy
      # Trust roxy's CA, which intercepts TLS. Most tools honour one of these.
      SSL_CERT_FILE: /tmp/roxy-ca.pem
      CURL_CA_BUNDLE: /tmp/roxy-ca.pem
      REQUESTS_CA_BUNDLE: /tmp/roxy-ca.pem
      NODE_EXTRA_CA_CERTS: /tmp/roxy-ca.pem
    # Fetch roxy's CA certificate, then idle; the demo runs commands in here.
    entrypoint: ["sh", "-c"]
    command:
      - curl -fsS http://roxy:3130/roxy-ca.pem -o /tmp/roxy-ca.pem && exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-s", "/tmp/roxy-ca.pem"]
      interval: 1s
      retries: 30

networks:
  sandbox:
    internal: true                   # no route out: the containment
  egress: {}

volumes:
  roxy-ca: {}
