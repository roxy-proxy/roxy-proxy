# The quickstart's WASM addons. A separate workspace from roxy's: it builds
# for wasm32-wasip2 only (addons/Dockerfile does so inside the compose build).
[workspace]
resolver = "3"
members = ["auth-gate", "token-quota"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
roxy-addon = { path = "../../../crates/roxy-addon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
