# roxy quickstart: clients behind roxy, with an auth gate, a per-user token
# quota and an inspect_sentinel sidecar, talking to a scripted model. roxy
# runs in node mode, leasing its policy from a minimal control plane.
# Nothing here needs an API key or a route out.
#
#   docker compose up --build --attach traffic    # Ctrl-C stops it; down -v cleans up
#   docker compose -f compose.yaml -f compose.standalone.yaml up --build   # roxy from the file instead
#
# Quota board: http://127.0.0.1:8090    Inspect View: http://127.0.0.1:7575
# The proxy is on 127.0.0.1:3128 for a client of your own (see README.md).
name: roxy-quickstart

# The mock services share this: hardened like the rest, and healthy once
# /healthz answers on their PORT.
x-mock: &mock
  image: roxy-quickstart-mocks
  build: ./mocks
  pull_policy: build
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"PORT\"]}/healthz', timeout=2)"]
    interval: 2s
    retries: 30

services:
  # roxy with the two WASM addons (./addons) baked into its image. In node
  # mode: it enrols with the control plane and leases roxy.yaml from it.
  roxy:
    image: roxy-quickstart
    build:
      context: ../..                       # the addons build against crates/roxy-addon
      dockerfile: examples/quickstart/addons/Dockerfile
      args:
        ROXY_IMAGE: ${ROXY_IMAGE:-ghcr.io/roxy-proxy/roxy:edge}
    pull_policy: build
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - run
      - --control-plane=https://controlplane:8443
      - --enrol-token-file=/run/secrets/enrol-token
      - --state-dir=/var/lib/roxy/node
      - --control-plane-ca=/shared/cp-ca.pem
    secrets: [enrol-token]
    volumes:
      # The node certificate, key and interception CA. A fresh enrolment
      # each start rather than a volume. Writable by roxy's non-root user.
      - { type: tmpfs, target: /var/lib/roxy/node, tmpfs: { mode: 0o1777 } }
      - cp-shared:/shared:ro               # the control plane's CA certificate
    ports:
      - "127.0.0.1:3128:3128"              # the proxy
      - "127.0.0.1:3130:3130"              # the CA certificate
    healthcheck:                           # ready: a policy is in force
      test: ["CMD", "/roxy", "health", "--ready"]
      interval: 2s
      retries: 30
    networks: [lab, sidecar, egress]
    depends_on:
      controlplane: { condition: service_healthy }
      fake-model: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      quota-board: { condition: service_healthy }
      sentinel: { condition: service_healthy }

  # The control plane (./controlplane): enrols roxy, serves roxy.yaml as its
  # lease with the model key from this environment, and prints the flow
  # events roxy ships. `docker compose stop controlplane` lets the lease run
  # down; `start` recovers it. Revoke the node with
  #   docker compose exec controlplane sh -c 'echo node-xxxxxx >> /data/revoked'
  controlplane:
    image: roxy-quickstart-controlplane
    build: ./controlplane
    pull_policy: build
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ENROL_TOKEN: quickstart-enrol-token  # what ./controlplane/enrol-token holds
      MODEL_API_KEY: fake-model-key        # the secret in the lease; the client never has it
      ROXY_CONFIG: /etc/roxy/roxy.yaml
      CA_OUT: /shared/cp-ca.pem
      LEASE_VALID_SECONDS: ${LEASE_VALID_SECONDS:-60}
      NODE_CERT_SECONDS: ${NODE_CERT_SECONDS:-600}  # the node certificate's lifetime; renewed halfway
    volumes:
      - ./roxy.yaml:/etc/roxy/roxy.yaml:ro
      - cp-data:/data                      # CA, server certificate, `revoked`
      - cp-shared:/shared
    networks: [lab]

  # The model: scripted responses from ./mocks/responses.json, in order.
  fake-model:
    <<: *mock
    command: ["python", "fake_model.py"]
    environment:
      PORT: 8080
      MODEL_API_KEY: fake-model-key        # refuses a call roxy did not put the key on
    networks: [lab]

  # Who a credential belongs to. alice-secret is alice, bob-secret is bob.
  auth-service:
    <<: *mock
    command: ["python", "auth_service.py"]
    environment:
      PORT: 9100
    networks: [lab]

  # Per-user token buckets, with a live page. Published on loopback only.
  quota-board:
    <<: *mock
    command: ["python", "quota_board.py"]
    environment:
      PORT: 8090
      QUOTA_CAPACITY: ${QUOTA_CAPACITY:-600}        # tokens in a full bucket
      QUOTA_REFILL_PER_SEC: ${QUOTA_REFILL_PER_SEC:-5}
    ports:
      - "127.0.0.1:8090:8090"
    networks: [lab, viewer]

  # The traffic: calls for alice, bob and mallory on their own cadences, for
  # ever. The only service `up --attach traffic` shows.
  traffic:
    <<: *mock
    command: ["python", "traffic.py"]
    environment:
      HTTP_PROXY: http://roxy:3128
      ANTHROPIC_BASE_URL: http://fake-model:8080
      TRAFFIC_SCHEDULE: ${TRAFFIC_SCHEDULE:-alice=alice-secret@6,bob=bob-secret@20,mallory=wrong@30}
    healthcheck:                           # healthy once its threads are up; `up --wait` needs one
      test: ["CMD", "test", "-f", "/tmp/traffic-started"]
      interval: 2s
      retries: 30
    tmpfs: [/tmp]
    networks: [lab]
    depends_on:
      roxy: { condition: service_healthy }

  # A call of your own: `docker compose run --rm client --user bob`. It
  # starts nothing else, so running it never restarts the stack.
  client:
    image: roxy-quickstart-mocks
    entrypoint: ["python", "chat.py"]
    environment:
      HTTP_PROXY: http://roxy:3128
      ANTHROPIC_BASE_URL: http://fake-model:8080
    networks: [lab]
    profiles: [client]

  # The sentinel sidecar (./sentinel): a regex denylist over tool calls.
  # It needs no route out, so it has none.
  sentinel:
    image: roxy-quickstart-sentinel
    build: ./sentinel
    pull_policy: build
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    # Starts with an empty log; the volume is there to share it with Inspect View.
    command: ["sh", "-c", "rm -rf /logs/* && exec python sidecar.py"]
    environment:
      SENTINEL: policies:deny_regex
      SENTINEL_DENY:                       # your regex, from the shell; unset = the default
    volumes:
      - sentinel-logs:/logs
    networks: [sidecar]

  # Inspect's log viewer over the sentinel's log: each client session, its
  # model calls and tool calls, and the sentinel's verdict on each.
  inspect-view:
    image: roxy-quickstart-sentinel
    build: ./sentinel                      # the sentinel's image; built once, cached
    pull_policy: build
    # Unauthenticated, so published on the host's loopback only.
    command:
      - inspect
      - view
      - --log-dir=/logs
      - --host=0.0.0.0
      - --port=7575
      - --unsafe-allow-unauthenticated
      - --trusted-origin=http://127.0.0.1:7575
      - --trusted-origin=http://localhost:7575
      - --trusted-host=127.0.0.1:7575
      - --trusted-host=localhost:7575
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - sentinel-logs:/logs:ro
    ports:
      - "127.0.0.1:7575:7575"
    networks: [viewer]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7575/', timeout=2)"]
      interval: 2s
      retries: 30
    depends_on:
      sentinel:
        condition: service_healthy

networks:
  lab:
    internal: true                         # roxy and the mocks; no route out
  sidecar:
    internal: true                         # roxy and the sentinel only
  egress: {}                               # roxy's published ports need a non-internal network
  viewer: {}

volumes:
  sentinel-logs: {}
  cp-data: {}
  cp-shared: {}

secrets:
  enrol-token:
    file: ./controlplane/enrol-token
