<svg xmlns="http://www.w3.org/2000/svg" width="800" height="452" viewBox="0 0 800 452" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
  </defs>

  <!-- the node and the control plane, with a lifeline under each -->
  <rect x="70" y="8" width="200" height="48" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="170" y="38" fill="#0f766e" font-size="17" font-weight="600" text-anchor="middle">roxy node</text>
  <rect x="520" y="8" width="200" height="48" rx="8" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="620" y="38" fill="#16201e" font-size="17" font-weight="600" text-anchor="middle">control plane</text>
  <g stroke="#cfd4d2" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="170" y1="56" x2="170" y2="446"/>
    <line x1="620" y1="56" x2="620" y2="446"/>
  </g>

  <!-- state dir beside the node -->
  <rect x="4" y="84" width="150" height="70" rx="6" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="79" y="106" fill="#16201e" font-weight="600" text-anchor="middle">state dir</text>
  <g fill="#5f6b68" font-size="13" text-anchor="middle">
    <text x="79" y="126">node token, CA,</text>
    <text x="79" y="144">quarantine marker</text>
  </g>

  <!-- phase labels -->
  <g fill="#5f6b68" font-size="14" font-weight="600">
    <text x="634" y="104">once</text>
    <text x="634" y="200">every</text>
    <text x="634" y="218">refresh_after_seconds</text>
    <text x="634" y="310">every few seconds</text>
    <text x="634" y="396">before the token</text>
    <text x="634" y="414">expires</text>
  </g>

  <!-- enrol -->
  <g fill="none" stroke-width="2">
    <path d="M 172 104 H 616" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 618 140 H 174" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e">
    <text x="186" y="96">enrol, with the enrolment token</text>
    <text x="604" y="132" text-anchor="end">node token</text>
  </g>

  <!-- lease -->
  <g fill="none" stroke-width="2">
    <path d="M 172 200 H 616" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 618 236 H 174" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e">
    <text x="186" y="192">lease: the node's state, and the lease it holds</text>
    <text x="604" y="228" text-anchor="end">the lease: config, secrets, how long it is valid</text>
  </g>
  <text x="186" y="262" fill="#5f6b68" font-size="14">no lease before it expires: the node denies everything</text>

  <!-- flows -->
  <g fill="none" stroke-width="2">
    <path d="M 172 310 H 616" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 618 346 H 174" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e">
    <text x="186" y="302">flows: a batch of flow-log events</text>
    <text x="604" y="338" text-anchor="end">acknowledged up to seq n</text>
  </g>

  <!-- renew -->
  <g fill="none" stroke-width="2">
    <path d="M 172 396 H 616" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 618 432 H 174" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e">
    <text x="186" y="388">renew, with the node token</text>
    <text x="604" y="424" text-anchor="end">a new node token</text>
  </g>
</svg>
