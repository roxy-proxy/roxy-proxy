<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
  </defs>

  <!-- the node and the control plane, with a lifeline under each -->
  <rect x="60" y="16" width="200" height="44" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="160" y="43" fill="#0f766e" font-weight="600" text-anchor="middle">roxy node</text>
  <rect x="500" y="16" width="200" height="44" rx="8" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="600" y="43" fill="#16201e" font-weight="600" text-anchor="middle">control plane</text>
  <g stroke="#cfd4d2" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="160" y1="60" x2="160" y2="404"/>
    <line x1="600" y1="60" x2="600" y2="404"/>
  </g>

  <!-- state dir beside the node -->
  <rect x="14" y="92" width="120" height="58" rx="6" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="74" y="112" fill="#16201e" font-weight="600" text-anchor="middle">state dir</text>
  <g fill="#7e8986" font-size="11" text-anchor="middle">
    <text x="74" y="128">node token, CA,</text>
    <text x="74" y="142">quarantine marker</text>
  </g>

  <!-- phase labels -->
  <g fill="#7e8986" font-size="11" font-weight="600">
    <text x="614" y="120">once</text>
    <text x="614" y="206">every refresh_after_seconds</text>
    <text x="614" y="306">every few seconds</text>
    <text x="614" y="386">before the token expires</text>
  </g>

  <!-- enrol -->
  <g fill="none" stroke-width="2">
    <path d="M 162 100 H 596" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 598 132 H 164" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e" font-size="12">
    <text x="176" y="94">enrol, with the enrolment token</text>
    <text x="584" y="126" text-anchor="end">node token</text>
  </g>

  <!-- lease -->
  <g fill="none" stroke-width="2">
    <path d="M 162 186 H 596" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 598 218 H 164" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e" font-size="12">
    <text x="176" y="180">lease: the node's state, and the lease it holds</text>
    <text x="584" y="212" text-anchor="end">the lease: config, secrets, how long it is valid</text>
  </g>
  <g fill="#7e8986" font-size="11">
    <text x="176" y="238">no lease before it expires: the node denies everything</text>
  </g>

  <!-- flows -->
  <g fill="none" stroke-width="2">
    <path d="M 162 286 H 596" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 598 318 H 164" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e" font-size="12">
    <text x="176" y="280">flows: a batch of flow-log events</text>
    <text x="584" y="312" text-anchor="end">acknowledged up to seq n</text>
  </g>

  <!-- renew -->
  <g fill="none" stroke-width="2">
    <path d="M 162 368 H 596" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 598 396 H 164" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <g fill="#16201e" font-size="12">
    <text x="176" y="362">renew, with the node token</text>
    <text x="584" y="390" text-anchor="end">a new node token</text>
  </g>
</svg>
