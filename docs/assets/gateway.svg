<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
  </defs>

  <!-- the auth service the exchange streams through; it says who the client is, nothing more -->
  <rect x="372" y="8" width="140" height="56" rx="6" fill="#ffffff" stroke="#cfd4d2"/>
  <text x="442" y="31" fill="#16201e" font-weight="600" text-anchor="middle">auth service</text>
  <text x="442" y="51" fill="#5f6b68" font-size="13" text-anchor="middle">over WebSocket</text>

  <!-- clients -->
  <rect x="4" y="182" width="84" height="88" rx="12" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="46" y="208" fill="#16201e" font-weight="600" text-anchor="middle">clients</text>
  <text x="46" y="230" fill="#5f6b68" font-size="13" text-anchor="middle">placeholder</text>
  <text x="46" y="248" fill="#5f6b68" font-size="13" text-anchor="middle">keys</text>

  <!-- load balancer -->
  <rect x="124" y="172" width="128" height="108" rx="8" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="188" y="196" fill="#16201e" font-size="16" font-weight="600" text-anchor="middle">load balancer</text>
  <g fill="#5f6b68" font-size="13" text-anchor="middle">
    <text x="188" y="226">terminates TLS</text>
    <text x="188" y="248">*.gw.example.com</text>
    <text x="188" y="268">X-Forwarded-For</text>
  </g>

  <!-- roxy -->
  <rect x="280" y="100" width="324" height="232" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="296" y="124" fill="#0f766e" font-weight="600">roxy</text>
  <g stroke="#cfd4d2" fill="#f3f5f4">
    <rect x="294" y="140" width="88" height="176" rx="6"/>
    <rect x="394" y="140" width="96" height="176" rx="6" stroke-dasharray="4 3"/>
    <rect x="502" y="140" width="88" height="176" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="338" y="164">listener</text>
    <text x="546" y="164">rules</text>
  </g>
  <g fill="#5f6b68" font-size="13" text-anchor="middle">
    <text x="338" y="284">mode: http</text>
    <text x="338" y="302">port 8080</text>
    <text x="442" y="284">service addon</text>
    <text x="442" y="302">401 if unknown</text>
    <text x="546" y="284">route by host</text>
    <text x="546" y="302">add secrets</text>
  </g>

  <!-- providers -->
  <g fill="#f3f5f4" stroke="#cfd4d2">
    <rect x="632" y="136" width="164" height="74" rx="8"/>
    <rect x="632" y="252" width="164" height="74" rx="8"/>
  </g>
  <g fill="#16201e" font-size="16" font-weight="600" text-anchor="middle">
    <text x="714" y="160">api.anthropic.com</text>
    <text x="714" y="276">api.openai.com</text>
  </g>
  <g fill="#5f6b68" font-size="13" text-anchor="middle">
    <text x="714" y="128">anthropic.gw.example.com</text>
    <text x="714" y="181">https</text>
    <text x="714" y="199">+ x-api-key</text>
    <text x="714" y="244">openai.gw.example.com</text>
    <text x="714" y="297">https</text>
    <text x="714" y="315">+ bearer key</text>
  </g>

  <!-- request and response, each leaving roxy for the auth service and coming back -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <path d="M 88 210 H 122" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 252 210 H 428 V 66" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 442 66 V 210 H 612 V 172 H 630" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 612 210 V 288 H 630" stroke="#0f766e" marker-end="url(#req)"/>
    <g stroke="#f3f5f4" stroke-width="6">
      <line x1="456" y1="202" x2="456" y2="218"/>
      <line x1="470" y1="202" x2="470" y2="218"/>
    </g>
    <path d="M 632 196 H 620 V 240 H 470 V 66" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 632 312 H 620 V 240" stroke="#5f6b68"/>
    <path d="M 456 66 V 240 H 254" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 124 240 H 90" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <text x="442" y="164" fill="#16201e" font-weight="600" text-anchor="middle" stroke="#f3f5f4" stroke-width="6" stroke-linejoin="round" paint-order="stroke">auth</text>
  <text x="420" y="88" fill="#5f6b68" font-size="13" text-anchor="end">who is this?</text>
  <text x="478" y="88" fill="#5f6b68" font-size="13">allow, user=alice</text>
  <text x="106" y="202" fill="#0f766e" font-size="13" font-weight="600" text-anchor="middle">https</text>
  <text x="266" y="202" fill="#0f766e" font-size="13" font-weight="600" text-anchor="middle">http</text>
</svg>
