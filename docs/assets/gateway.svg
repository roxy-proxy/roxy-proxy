<svg xmlns="http://www.w3.org/2000/svg" width="800" height="316" viewBox="0 0 800 316" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
  </defs>

  <!-- the auth service the exchange streams through; it says who the client is, nothing more -->
  <rect x="398" y="68" width="100" height="44" rx="6" fill="#ffffff" stroke="#cfd4d2"/>
  <text x="448" y="87" fill="#16201e" font-weight="600" text-anchor="middle">auth service</text>
  <text x="448" y="101" fill="#7e8986" font-size="10" text-anchor="middle">over WebSocket</text>

  <!-- clients -->
  <rect x="14" y="182" width="104" height="56" rx="12" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="66" y="205" fill="#16201e" font-weight="600" text-anchor="middle">clients</text>
  <text x="66" y="221" fill="#7e8986" font-size="10" text-anchor="middle">placeholder keys</text>

  <!-- load balancer -->
  <rect x="150" y="170" width="112" height="80" rx="8" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="206" y="193" fill="#16201e" font-weight="600" text-anchor="middle">load balancer</text>
  <g fill="#7e8986" font-size="10" text-anchor="middle">
    <text x="206" y="209">terminates TLS</text>
    <text x="206" y="223">*.gw.example.com</text>
    <text x="206" y="237">roxy's client.ip</text>
  </g>

  <!-- roxy -->
  <rect x="302" y="120" width="290" height="176" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="318" y="141" fill="#0f766e" font-weight="600">roxy</text>
  <g stroke="#cfd4d2" fill="#f3f5f4">
    <rect x="318" y="160" width="76" height="120" rx="6"/>
    <rect x="406" y="160" width="84" height="120" rx="6" stroke-dasharray="4 3"/>
    <rect x="502" y="160" width="76" height="120" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="356" y="181">listener</text>
    <text x="540" y="181">rules</text>
  </g>
  <g fill="#7e8986" font-size="11" text-anchor="middle">
    <text x="356" y="260">mode: http</text>
    <text x="356" y="273">port 8080</text>
    <text x="448" y="260">service addon</text>
    <text x="448" y="273">401 if unknown</text>
    <text x="540" y="260">route by host</text>
    <text x="540" y="273">inject secrets</text>
  </g>

  <!-- providers -->
  <g fill="#f3f5f4" stroke="#cfd4d2">
    <rect x="646" y="146" width="144" height="56" rx="8"/>
    <rect x="646" y="224" width="144" height="56" rx="8"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="718" y="166">api.anthropic.com</text>
    <text x="718" y="244">api.openai.com</text>
  </g>
  <g fill="#7e8986" font-size="10" text-anchor="middle">
    <text x="718" y="138">anthropic.gw.example.com</text>
    <text x="718" y="181">https</text>
    <text x="718" y="195">+ x-api-key from secrets</text>
    <text x="718" y="216">openai.gw.example.com</text>
    <text x="718" y="259">https</text>
    <text x="718" y="273">+ bearer key from secrets</text>
  </g>

  <!-- request and response, each leaving roxy for the auth service and coming back -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <path d="M 118 200 H 148" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 262 200 H 424 V 114" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 440 114 V 200 H 606 V 174 H 644" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 606 200 V 252 H 644" stroke="#0f766e" marker-end="url(#req)"/>
    <g stroke="#f3f5f4" stroke-width="6">
      <line x1="456" y1="192" x2="456" y2="208"/>
      <line x1="472" y1="192" x2="472" y2="208"/>
    </g>
    <path d="M 646 186 H 624 V 222 H 472 V 114" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 646 264 H 624 V 222" stroke="#5f6b68"/>
    <path d="M 456 114 V 222 H 264" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 150 222 H 120" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <text x="448" y="181" fill="#16201e" font-weight="600" text-anchor="middle" stroke="#f3f5f4" stroke-width="5" stroke-linejoin="round" paint-order="stroke">auth</text>
  <text x="418" y="131" fill="#7e8986" font-size="10" text-anchor="end">who is this?</text>
  <text x="478" y="131" fill="#7e8986" font-size="10">allow, user=alice</text>
  <text x="133" y="193" fill="#0f766e" font-size="10" font-weight="600" text-anchor="middle">https</text>
  <text x="282" y="193" fill="#0f766e" font-size="10" font-weight="600" text-anchor="middle">http</text>
</svg>
