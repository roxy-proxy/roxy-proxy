<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
    <marker id="thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e8986"/>
    </marker>
  </defs>

  <!-- the three services the layers talk to -->
  <g fill="#ffffff" stroke="#cfd4d2">
    <rect x="164" y="8" width="112" height="44" rx="6"/>
    <rect x="300" y="8" width="112" height="44" rx="6"/>
    <rect x="436" y="8" width="112" height="44" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="220" y="27">auth-service</text>
    <text x="356" y="27">quota-board</text>
    <text x="492" y="27">sentinel</text>
  </g>
  <g fill="#7e8986" font-size="10" text-anchor="middle">
    <text x="220" y="42">POST /introspect</text>
    <text x="356" y="42">/check, then /report</text>
    <text x="492" y="42">over WebSocket</text>
  </g>

  <!-- roxy -->
  <rect x="130" y="80" width="640" height="210" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="146" y="101" fill="#0f766e" font-weight="600" font-size="13">roxy</text>

  <!-- stages -->
  <g stroke="#cfd4d2" fill="#f3f5f4">
    <rect x="166" y="112" width="108" height="150" rx="6" stroke-dasharray="4 3"/>
    <rect x="302" y="112" width="108" height="150" rx="6" stroke-dasharray="4 3"/>
    <rect x="438" y="112" width="108" height="150" rx="6" stroke-dasharray="4 3"/>
    <rect x="574" y="112" width="84" height="150" rx="6"/>
    <rect x="674" y="112" width="84" height="150" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="220" y="133">auth-gate</text>
    <text x="356" y="133">token-quota</text>
    <text x="616" y="133">Rules</text>
    <text x="716" y="133">Connect</text>
  </g>
  <g fill="#7e8986" font-size="11" text-anchor="middle">
    <text x="220" y="227">WASM</text>
    <text x="220" y="240">401 if unknown</text>
    <text x="220" y="253">tags user:alice</text>
    <text x="356" y="227">WASM</text>
    <text x="356" y="240">429 when over</text>
    <text x="356" y="253">meters usage</text>
    <text x="492" y="227">service</text>
    <text x="492" y="240">judges tool calls</text>
    <text x="492" y="253">holds the stream</text>
    <text x="616" y="240">set x-api-key</text>
    <text x="616" y="253">allow fake-model</text>
    <text x="716" y="240">address floor</text>
    <text x="716" y="253">private_ok</text>
  </g>

  <!-- client and upstream -->
  <rect x="14" y="160" width="92" height="40" rx="20" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="60" y="179" fill="#16201e" font-weight="600" text-anchor="middle">client</text>
  <text x="60" y="193" fill="#7e8986" font-size="10" text-anchor="middle">chat.py, as alice</text>
  <rect x="794" y="160" width="92" height="40" rx="20" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="840" y="179" fill="#16201e" font-weight="600" text-anchor="middle">fake-model</text>
  <text x="840" y="193" fill="#7e8986" font-size="10" text-anchor="middle">POST /v1/messages</text>

  <!-- request and response, each leaving roxy for the sentinel and coming back -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <path d="M 106 155 H 466 V 54" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 484 54 V 155 H 792" stroke="#0f766e" marker-end="url(#req)"/>
    <g stroke="#f3f5f4" stroke-width="6">
      <line x1="500" y1="147" x2="500" y2="163"/>
      <line x1="518" y1="147" x2="518" y2="163"/>
    </g>
    <path d="M 794 205 H 518 V 54" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 500 54 V 205 H 108" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <text x="492" y="133" fill="#16201e" font-weight="600" text-anchor="middle" stroke="#f3f5f4" stroke-width="5" stroke-linejoin="round" paint-order="stroke">sentinel</text>
  <text x="126" y="148" fill="#0f766e" font-size="11" font-weight="600" text-anchor="end">request</text>
  <text x="126" y="221" fill="#5f6b68" font-size="11" font-weight="600" text-anchor="end">response</text>

  <!-- endpoint calls -->
  <g stroke="#7e8986" stroke-width="1.2" fill="none">
    <line x1="213" y1="153" x2="213" y2="54" marker-end="url(#thin)"/>
    <line x1="227" y1="54" x2="227" y2="153" marker-end="url(#thin)"/>
    <line x1="340" y1="153" x2="340" y2="54" marker-end="url(#thin)"/>
    <line x1="354" y1="54" x2="354" y2="153" marker-end="url(#thin)"/>
    <line x1="372" y1="203" x2="372" y2="54" marker-end="url(#thin)"/>
  </g>
  <g fill="#7e8986" font-size="10">
    <text x="190" y="72" text-anchor="end">who?</text>
    <text x="318" y="72" text-anchor="end">may spend?</text>
    <text x="378" y="72">used</text>
  </g>

  <!-- flow log -->
  <g stroke="#cfd4d2" stroke-dasharray="3 3">
    <line x1="220" y1="262" x2="220" y2="320"/>
    <line x1="356" y1="262" x2="356" y2="320"/>
    <line x1="492" y1="262" x2="492" y2="320"/>
    <line x1="616" y1="262" x2="616" y2="320"/>
    <line x1="716" y1="262" x2="716" y2="320"/>
  </g>
  <rect x="130" y="320" width="640" height="74" rx="10" fill="#f8f9f8" stroke="#e6e8e7"/>
  <text x="450" y="342" fill="#3d4846" text-anchor="middle">flow log: one line per exchange</text>
  <g fill="#7e8986" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="450" y="362">"addons":["auth-gate","token-quota","sentinel"]  "tags":["user:alice"]</text>
    <text x="450" y="380">"mutations":["set_header:x-api-key"]  "decision":"allow"  "res":{"status":200}</text>
  </g>
</svg>
