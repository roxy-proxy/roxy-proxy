<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
    <marker id="thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e8986"/>
    </marker>
  </defs>

  <!-- roxy -->
  <rect x="130" y="70" width="540" height="190" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="146" y="91" fill="#0f766e" font-weight="600" font-size="13">roxy</text>

  <!-- stages -->
  <g stroke="#cfd4d2" fill="#f3f5f4">
    <rect x="150" y="100" width="70" height="135" rx="6"/>
    <rect x="240" y="100" width="80" height="135" rx="6" stroke-dasharray="4 3"/>
    <rect x="340" y="100" width="80" height="135" rx="6" stroke-dasharray="4 3"/>
    <rect x="440" y="100" width="80" height="135" rx="6"/>
    <rect x="540" y="100" width="110" height="135" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="185" y="120">TLS</text>
    <text x="380" y="120">Addon</text>
    <text x="480" y="120">Rules</text>
    <text x="595" y="120">Connect</text>
  </g>
  <g fill="#7e8986" font-size="11" text-anchor="middle">
    <text x="185" y="224">decrypt</text>
    <text x="280" y="224">service</text>
    <text x="380" y="224">WASM</text>
    <text x="480" y="224">deny wins</text>
    <text x="595" y="224">address floor</text>
  </g>

  <!-- client and upstream -->
  <rect x="14" y="145" width="92" height="40" rx="20" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="60" y="170" fill="#16201e" font-weight="600" text-anchor="middle">client</text>
  <rect x="694" y="145" width="92" height="40" rx="20" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="740" y="170" fill="#16201e" font-weight="600" text-anchor="middle">upstream</text>


  <!-- service sidecar -->
  <rect x="230" y="8" width="100" height="40" rx="6" fill="#ffffff" stroke="#cfd4d2"/>
  <text x="280" y="27" fill="#16201e" font-weight="600" text-anchor="middle">Service</text>
  <text x="280" y="41" fill="#7e8986" font-size="10" text-anchor="middle">over WebSocket</text>

  <!-- request and response, each leaving roxy for the service addon and coming back -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <path d="M 106 140 H 252 V 50" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 268 50 V 140 H 692" stroke="#0f766e" marker-end="url(#req)"/>
    <g stroke="#f3f5f4" stroke-width="6">
      <line x1="292" y1="132" x2="292" y2="148"/>
      <line x1="308" y1="132" x2="308" y2="148"/>
    </g>
    <path d="M 694 190 H 308 V 50" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 292 50 V 190 H 108" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <text x="280" y="120" fill="#16201e" font-weight="600" text-anchor="middle" stroke="#f3f5f4" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Addon</text>
  <text x="112" y="133" fill="#0f766e" font-size="11" font-weight="600">request</text>
  <text x="680" y="206" fill="#5f6b68" font-size="11" font-weight="600" text-anchor="end">response</text>

  <!-- flow log -->
  <g stroke="#cfd4d2" stroke-dasharray="3 3">
    <line x1="185" y1="235" x2="185" y2="284"/>
    <line x1="280" y1="235" x2="280" y2="284"/>
    <line x1="380" y1="235" x2="380" y2="284"/>
    <line x1="480" y1="235" x2="480" y2="284"/>
    <line x1="595" y1="235" x2="595" y2="284"/>
  </g>
  <rect x="130" y="284" width="540" height="34" rx="17" fill="#f8f9f8" stroke="#e6e8e7"/>
  <text x="400" y="305" fill="#3d4846" text-anchor="middle">flow log: every exchange and every decision, never dropped</text>
</svg>
