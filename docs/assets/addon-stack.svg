<svg xmlns="http://www.w3.org/2000/svg" width="680" height="564" viewBox="0 0 680 564" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
  </defs>

  <!-- client and origin -->
  <rect x="200" y="8" width="200" height="44" rx="22" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="300" y="36" fill="#16201e" font-weight="600" text-anchor="middle">client</text>
  <rect x="200" y="512" width="200" height="44" rx="22" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="300" y="540" fill="#16201e" font-weight="600" text-anchor="middle">origin</text>

  <!-- the steps, top to bottom; addons are the dashed ones -->
  <g fill="#f3f5f4" stroke="#cfd4d2">
    <rect x="100" y="80" width="400" height="48" rx="6"/>
    <rect x="100" y="152" width="400" height="48" rx="6" fill="#ffffff" stroke="#0f766e" stroke-dasharray="5 4"/>
    <rect x="100" y="224" width="400" height="48" rx="6" fill="#ffffff" stroke="#0f766e" stroke-dasharray="5 4"/>
    <rect x="100" y="296" width="400" height="48" rx="6"/>
    <rect x="100" y="368" width="400" height="48" rx="6"/>
    <rect x="100" y="440" width="400" height="48" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="300" y="110">CONNECT and TLS</text>
    <text x="300" y="182">first addon listed</text>
    <text x="300" y="254">second addon listed</text>
    <text x="300" y="326">rules</text>
    <text x="300" y="398">address floor</text>
    <text x="300" y="470">connection to the origin</text>
  </g>

  <!-- request down, response up -->
  <g fill="none" stroke-width="2">
    <g stroke="#0f766e" marker-end="url(#req)">
      <path d="M 250 52 V 78"/>
      <path d="M 250 128 V 150"/>
      <path d="M 250 200 V 222"/>
      <path d="M 250 272 V 294"/>
      <path d="M 250 344 V 366"/>
      <path d="M 250 416 V 438"/>
      <path d="M 250 488 V 510"/>
    </g>
    <g stroke="#5f6b68" marker-end="url(#res)">
      <path d="M 350 512 V 490"/>
      <path d="M 350 440 V 418"/>
      <path d="M 350 368 V 346"/>
      <path d="M 350 296 V 274"/>
      <path d="M 350 224 V 202"/>
      <path d="M 350 152 V 130"/>
      <path d="M 350 80 V 54"/>
    </g>
  </g>
  <text x="238" y="72" fill="#0f766e" font-size="14" font-weight="600" text-anchor="end">request</text>
  <text x="362" y="72" fill="#5f6b68" font-size="14" font-weight="600">response</text>

  <!-- capture: taps what crosses between the rules and the network -->
  <path d="M 100 356 H 520" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2 4"/>
  <g fill="#0f766e" font-size="14" font-weight="600">
    <text x="536" y="342">capture: what</text>
    <text x="536" y="360">crosses here</text>
  </g>

  <!-- flow log: every step feeds the exchange's one record -->
  <g stroke="#cfd4d2" stroke-dasharray="3 3">
    <line x1="60" y1="104" x2="100" y2="104"/>
    <line x1="60" y1="176" x2="100" y2="176"/>
    <line x1="60" y1="248" x2="100" y2="248"/>
    <line x1="60" y1="320" x2="100" y2="320"/>
    <line x1="60" y1="392" x2="100" y2="392"/>
    <line x1="60" y1="464" x2="100" y2="464"/>
  </g>
  <rect x="12" y="80" width="48" height="408" rx="24" fill="#f8f9f8" stroke="#e6e8e7"/>
  <text transform="translate(42 284) rotate(-90)" fill="#3d4846" font-size="16" text-anchor="middle">flow log: one record per exchange</text>

  <!-- what is configurable, and what is not -->
  <path d="M 516 156 h 8 V 268 h -8" fill="none" stroke="#7e8986" stroke-width="1.5"/>
  <g fill="#5f6b68" font-size="14">
    <text x="536" y="206">addons, in the</text>
    <text x="536" y="224">order listed</text>
  </g>
  <path d="M 516 372 h 8 V 484 h -8" fill="none" stroke="#7e8986" stroke-width="1.5"/>
  <g fill="#5f6b68" font-size="14">
    <text x="536" y="422">always run,</text>
    <text x="536" y="440">after the rules</text>
  </g>
</svg>
