<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
    <marker id="thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e8986"/>
    </marker>
  </defs>

  <!-- the sealed network: nothing leaves it except through roxy -->
  <rect x="14" y="36" width="426" height="236" rx="10" fill="none" stroke="#16201e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="58" fill="#16201e" font-weight="600">sandbox network</text>
  <text x="30" y="73" fill="#7e8986" font-size="11">no route out except roxy</text>

  <!-- workload -->
  <rect x="30" y="118" width="150" height="60" rx="12" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="105" y="140" fill="#16201e" font-weight="600" text-anchor="middle">workload</text>
  <text x="105" y="155" fill="#7e8986" font-size="10" text-anchor="middle">HTTPS_PROXY=roxy:3128</text>
  <text x="105" y="168" fill="#7e8986" font-size="10" text-anchor="middle">trusts roxy's CA</text>

  <!-- roxy, the only host on both networks; drawn over the boundary -->
  <rect x="330" y="90" width="240" height="150" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="346" y="111" fill="#0f766e" font-weight="600">roxy</text>
  <g stroke="#cfd4d2" fill="#f3f5f4">
    <rect x="346" y="126" width="100" height="48" rx="6"/>
    <rect x="346" y="186" width="44" height="26" rx="6"/>
    <rect x="398" y="186" width="72" height="26" rx="6"/>
  </g>
  <text x="396" y="146" fill="#16201e" font-weight="600" text-anchor="middle">proxy port</text>
  <text x="396" y="162" fill="#7e8986" font-size="11" text-anchor="middle">3128</text>
  <text x="368" y="203" fill="#16201e" font-size="11" font-weight="600" text-anchor="middle">CA</text>
  <text x="434" y="203" fill="#16201e" font-size="11" font-weight="600" text-anchor="middle">secrets</text>
  <g fill="#7e8986" font-size="11" text-anchor="middle">
    <text x="520" y="146">decrypt</text>
    <text x="520" y="160">addons</text>
    <text x="520" y="174">rules</text>
    <text x="520" y="188">address floor</text>
    <text x="520" y="202">flow log</text>
  </g>

  <!-- allowed upstreams -->
  <rect x="650" y="102" width="136" height="72" rx="8" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="718" y="124" fill="#16201e" font-weight="600" text-anchor="middle">allowed upstreams</text>
  <text x="718" y="142" fill="#7e8986" font-size="11" text-anchor="middle">api.anthropic.com</text>
  <text x="718" y="157" fill="#7e8986" font-size="11" text-anchor="middle">github.com</text>

  <!-- request and response -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <path d="M 180 138 H 328" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 570 138 H 648" stroke="#0f766e" marker-end="url(#req)"/>
    <path d="M 650 162 H 572" stroke="#5f6b68" marker-end="url(#res)"/>
    <path d="M 330 162 H 182" stroke="#5f6b68" marker-end="url(#res)"/>
  </g>
  <text x="188" y="131" fill="#0f766e" font-size="11" font-weight="600">request</text>
  <text x="322" y="176" fill="#5f6b68" font-size="11" font-weight="600" text-anchor="end">response</text>
  <text x="609" y="130" fill="#0f766e" font-size="10" font-weight="600" text-anchor="middle">real key added</text>

  <!-- the CA, fetched from roxy -->
  <path d="M 346 199 H 240 V 228 H 105 V 180" fill="none" stroke="#7e8986" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#thin)"/>
  <text x="246" y="224" fill="#7e8986" font-size="10">roxy-ca.pem, port 3130</text>

  <!-- a direct route out: blocked at the boundary -->
  <path d="M 50 178 V 252 H 432" fill="none" stroke="#7e8986" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g stroke="#16201e" stroke-width="2.2" stroke-linecap="round">
    <line x1="434" y1="246" x2="446" y2="258"/>
    <line x1="446" y1="246" x2="434" y2="258"/>
  </g>
  <text x="60" y="247" fill="#7e8986" font-size="11">direct TCP, UDP and DNS: no route</text>
</svg>
