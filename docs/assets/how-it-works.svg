<svg xmlns="http://www.w3.org/2000/svg" width="800" height="772" viewBox="0 0 800 772" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17">
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b68"/>
    </marker>
    <marker id="thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e8986"/>
    </marker>
  </defs>

  <!-- client and upstream -->
  <rect x="147" y="8" width="200" height="44" rx="22" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="247" y="36" fill="#16201e" font-weight="600" text-anchor="middle">client</text>
  <rect x="147" y="720" width="200" height="44" rx="22" fill="#f3f5f4" stroke="#cfd4d2"/>
  <text x="247" y="748" fill="#16201e" font-weight="600" text-anchor="middle">upstream</text>

  <!-- roxy -->
  <rect x="8" y="72" width="478" height="628" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="22" y="94" fill="#0f766e" font-weight="600">roxy</text>

  <!-- stages -->
  <g stroke="#cfd4d2" fill="#f3f5f4">
    <rect x="22" y="104" width="450" height="112" rx="6"/>
    <rect x="22" y="260" width="450" height="136" rx="6"/>
    <rect x="22" y="440" width="450" height="112" rx="6"/>
    <rect x="22" y="596" width="450" height="90" rx="6"/>
  </g>
  <g fill="#16201e" font-weight="600" text-anchor="middle">
    <text x="247" y="130">decrypt and parse</text>
    <text x="247" y="286">addons</text>
    <text x="247" y="466">rules</text>
    <text x="247" y="622">connect</text>
  </g>
  <g fill="#5f6b68" font-size="14" text-anchor="middle">
    <text x="247" y="152">CONNECT · TLS · strict parse → canonical request</text>
    <text x="247" y="172">lease still valid</text>
    <text x="247" y="202">response: canonical re-serialisation to the client</text>
    <text x="247" y="488">lease still valid</text>
    <text x="247" y="508">deny wins · effects: secrets, headers, redirect, sign</text>
    <text x="247" y="538">response: in-flight rules on the head and bodies</text>
    <text x="247" y="644">DNS · address floor · upstream TLS</text>
    <text x="247" y="672">response: re-framed, streamed back up the stack</text>
  </g>

  <!-- addon stack: enforce layers in the path, observers beside it on a copy -->
  <rect x="38" y="302" width="332" height="78" rx="6" fill="#ffffff" stroke="#cfd4d2"/>
  <text x="204" y="332" fill="#16201e" font-weight="600" font-size="15" text-anchor="middle">enforce layers, in order</text>
  <text x="204" y="356" fill="#5f6b68" font-size="14" text-anchor="middle">rewrite · hold · answer · block</text>
  <rect x="386" y="302" width="74" height="78" rx="6" fill="#ffffff" stroke="#cfd4d2" stroke-dasharray="4 3"/>
  <text x="423" y="334" fill="#16201e" font-weight="600" font-size="14" text-anchor="middle">observer</text>
  <text x="423" y="354" fill="#5f6b68" font-size="13" text-anchor="middle">a copy</text>
  <line x1="370" y1="341" x2="384" y2="341" stroke="#7e8986" stroke-dasharray="3 3" marker-end="url(#thin)"/>

  <!-- request down, response up -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <g stroke="#0f766e" marker-end="url(#req)">
      <path d="M 167 52 V 102"/>
      <path d="M 167 216 V 258"/>
      <path d="M 167 396 V 438"/>
      <path d="M 167 552 V 594"/>
      <path d="M 167 686 V 718"/>
    </g>
    <g stroke="#5f6b68" marker-end="url(#res)">
      <path d="M 327 720 V 688"/>
      <path d="M 327 596 V 554"/>
      <path d="M 327 440 V 398"/>
      <path d="M 327 260 V 218"/>
      <path d="M 327 104 V 54"/>
    </g>
  </g>
  <text x="159" y="66" fill="#0f766e" font-size="14" font-weight="600" text-anchor="end">request</text>
  <text x="335" y="66" fill="#5f6b68" font-size="14" font-weight="600">response</text>

  <!-- exits: each a branch to the right -->
  <g fill="none" stroke="#5f6b68" stroke-width="2" marker-end="url(#res)">
    <path d="M 472 128 H 502"/>
    <path d="M 472 166 H 502"/>
    <path d="M 472 284 H 502"/>
    <path d="M 472 330 H 502"/>
    <path d="M 472 464 H 502"/>
    <path d="M 472 502 H 502"/>
    <path d="M 472 620 H 502"/>
  </g>
  <g fill="#ffffff" stroke="#5f6b68">
    <rect x="504" y="112" width="212" height="32" rx="6"/>
    <rect x="504" y="150" width="212" height="32" rx="6"/>
    <rect x="504" y="268" width="212" height="32" rx="6"/>
    <rect x="504" y="314" width="212" height="32" rx="6"/>
    <rect x="504" y="448" width="212" height="32" rx="6"/>
    <rect x="504" y="486" width="212" height="32" rx="6"/>
    <rect x="504" y="604" width="212" height="32" rx="6"/>
  </g>
  <g fill="#3d4846" font-size="14" text-anchor="middle">
    <text x="610" y="133">malformed → refused</text>
    <text x="610" y="171">expired → _expired</text>
    <text x="610" y="289">answers the client</text>
    <text x="610" y="335">denies → layer:name</text>
    <text x="610" y="469">expired → _expired</text>
    <text x="610" y="507">denies → rule id</text>
    <text x="610" y="625">private → _address_policy</text>
  </g>

  <!-- capture: taps what crosses between the rules and the network -->
  <path d="M 8 574 H 502" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="504" y="579" fill="#0f766e" font-size="14" font-weight="600">capture: what crosses here</text>

  <!-- flow log: every stage and every exit feeds it -->
  <g stroke="#cfd4d2" stroke-dasharray="3 3">
    <line x1="472" y1="204" x2="740" y2="204"/>
    <line x1="472" y1="384" x2="740" y2="384"/>
    <line x1="472" y1="540" x2="740" y2="540"/>
    <line x1="472" y1="676" x2="740" y2="676"/>
    <line x1="716" y1="128" x2="740" y2="128"/>
    <line x1="716" y1="166" x2="740" y2="166"/>
    <line x1="716" y1="284" x2="740" y2="284"/>
    <line x1="716" y1="330" x2="740" y2="330"/>
    <line x1="716" y1="464" x2="740" y2="464"/>
    <line x1="716" y1="502" x2="740" y2="502"/>
    <line x1="716" y1="620" x2="740" y2="620"/>
  </g>
  <rect x="740" y="104" width="48" height="582" rx="24" fill="#f8f9f8" stroke="#e6e8e7"/>
  <text transform="translate(770 395) rotate(-90)" fill="#3d4846" font-size="16" text-anchor="middle">flow log: one record per exchange, never dropped</text>
</svg>
